<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1850 1220" width="1850" height="1220">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: "Inter", system-ui, -apple-system, sans-serif; }
      .title { font-size: 30px; fill: #f8fafc; font-weight: 700; }
      .sub { font-size: 14px; fill: #64748b; }
      .cap { font-size: 13px; letter-spacing: 1.5px; }
      .h { font-size: 15px; font-weight: 600; }
      .b { font-size: 11px; fill: #cbd5e1; }
      .band-h { font-size: 19px; font-weight: 700; fill: #a78bfa; }
      .band-1 { font-size: 12.5px; fill: #e2e8f0; }
      .band-2 { font-size: 12px; fill: #94a3b8; }
      .note { font-size: 12.5px; fill: #cbd5e1; }
      .note-h { font-size: 14px; fill: #94a3b8; letter-spacing: 1px; }
      .lbl { font-size: 11px; fill: #64748b; }
    </style>
  </defs>

  <rect x="0" y="0" width="1850" height="1220" fill="#0a0a0a"/>
  <text x="925" y="46" text-anchor="middle" class="title">Thoth Architecture</text>
  <text x="925" y="70" text-anchor="middle" class="sub">thoth-ui → thoth-cli → thoth-core · Papyrus handle data plane · DuckDB + Arrow · sandboxed WASM plugins</text>

  <!-- ============================ PRESENTATION (thoth-ui) ============================ -->
  <text x="60" y="98" class="cap" fill="#60a5fa">PRESENTATION · thoth-ui (egui / eframe desktop)</text>
  <rect x="60" y="106" width="1730" height="124" rx="12" fill="#0c1322" stroke="#60a5fa" stroke-opacity="0.35" stroke-width="2"/>

  <rect x="80" y="124" width="270" height="88" rx="8" fill="#131c2e" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="96" y="150" class="h" fill="#60a5fa">Toolbar &amp; Navigation</text>
  <text x="96" y="172" class="b">• File ops · history nav</text>
  <text x="96" y="190" class="b">• Search box · theme toggle</text>

  <rect x="364" y="124" width="270" height="88" rx="8" fill="#131c2e" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="380" y="150" class="h" fill="#60a5fa">Sidebar &amp; Marketplace</text>
  <text x="380" y="172" class="b">• Data sources · plugin tabs</text>
  <text x="380" y="190" class="b">• Recent files · bookmarks · install</text>

  <rect x="648" y="124" width="270" height="88" rx="8" fill="#131c2e" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="664" y="150" class="h" fill="#60a5fa">Central Panel &amp; Viewers</text>
  <text x="664" y="172" class="b">• Arrow/JSON tree · DataView</text>
  <text x="664" y="190" class="b">• Plugin renderers · welcome</text>

  <rect x="932" y="124" width="270" height="88" rx="8" fill="#131c2e" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="948" y="150" class="h" fill="#60a5fa">Chart &amp; Map Studio</text>
  <text x="948" y="172" class="b">• Revision-following charts</text>
  <text x="948" y="190" class="b">• Transforms · handle-pinned</text>

  <rect x="1216" y="124" width="270" height="88" rx="8" fill="#131c2e" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="1232" y="150" class="h" fill="#60a5fa">Settings &amp; Consent</text>
  <text x="1232" y="172" class="b">• Preferences · shortcuts</text>
  <text x="1232" y="190" class="b">• Toasts · host &amp; dataset grants</text>

  <rect x="1500" y="124" width="270" height="88" rx="8" fill="#131c2e" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="1516" y="150" class="h" fill="#60a5fa">Theme &amp; Platform Seams</text>
  <text x="1516" y="172" class="b">• Dark / light tokens · fonts</text>
  <text x="1516" y="190" class="b">• Native menu · repaint &amp; dialogs</text>

  <line x1="925" y1="230" x2="925" y2="254" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ====================== SHARED SDK & WIT BAND ====================== -->
  <text x="60" y="276" class="cap" fill="#a78bfa">SHARED UI &amp; ABI · used by host AND plugins</text>
  <rect x="60" y="284" width="1730" height="92" rx="12" fill="#1a1535" stroke="#a78bfa" stroke-width="2.5"/>
  <text x="84" y="320" class="band-h">thoth-plugin-sdk + WIT v0.3.0</text>
  <text x="415" y="320" class="band-1">component builders · RenderNode DSL · DataView · theme tokens · PluginState / SettingsMap · #[derive(PluginMeta)]</text>
  <text x="84" y="350" class="band-2">Single source of truth for widgets and ABI contracts (dataset-bus, dataset-read, data-producer, data-renderer, exporter) shared by thoth-ui and WASM plugins.</text>

  <line x1="925" y1="376" x2="925" y2="400" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============================ CORE & CLI (thoth-core + thoth-cli) ============================ -->
  <text x="60" y="422" class="cap" fill="#34d399">HOST LOGIC &amp; CLI · thoth-core + thoth-cli (display-independent)</text>
  <rect x="60" y="430" width="1730" height="142" rx="12" fill="#0c1322" stroke="#34d399" stroke-opacity="0.35" stroke-width="2"/>

  <rect x="80" y="448" width="270" height="106" rx="8" fill="#131c2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="96" y="474" class="h" fill="#34d399">Papyrus (Data Plane)</text>
  <text x="96" y="496" class="b">• Single handle registry (ds-N)</text>
  <text x="96" y="514" class="b">• Arrow · Rows · Text sheets</text>
  <text x="96" y="532" class="b">• Revisions · pins · 128 MB LRU</text>

  <rect x="364" y="448" width="270" height="106" rx="8" fill="#131c2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="380" y="474" class="h" fill="#34d399">File &amp; Index Controller</text>
  <text x="380" y="496" class="b">• Off-thread indexing · sniffing</text>
  <text x="380" y="514" class="b">• BatchLoader · RelationLoader</text>
  <text x="380" y="532" class="b">• to_dataset (Chart/export cap)</text>

  <rect x="648" y="448" width="270" height="106" rx="8" fill="#131c2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="664" y="474" class="h" fill="#34d399">App &amp; CLI Orchestration</text>
  <text x="664" y="496" class="b">• ThothApp · TabManager</text>
  <text x="664" y="514" class="b">• thoth-cli (cli, headless)</text>
  <text x="664" y="532" class="b">• Host seams (repaint, dialogs)</text>

  <rect x="932" y="448" width="270" height="106" rx="8" fill="#131c2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="948" y="474" class="h" fill="#34d399">Search &amp; Query</text>
  <text x="948" y="496" class="b">• Text + JSONPath · parallel</text>
  <text x="948" y="514" class="b">• DuckDB SQL · saved queries</text>
  <text x="948" y="532" class="b">• Highlight map (path + ranges)</text>

  <rect x="1216" y="448" width="270" height="106" rx="8" fill="#131c2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="1232" y="474" class="h" fill="#34d399">MCP Server</text>
  <text x="1232" y="496" class="b">• AI-assistant tools (10 tools)</text>
  <text x="1232" y="514" class="b">• stdio transport</text>
  <text x="1232" y="532" class="b">• ServerState handle mgmt</text>

  <rect x="1500" y="448" width="270" height="106" rx="8" fill="#131c2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="1516" y="474" class="h" fill="#34d399">Settings, Updates &amp; Errors</text>
  <text x="1516" y="496" class="b">• TOML settings · theme store</text>
  <text x="1516" y="514" class="b">• Auto-updater · release checks</text>
  <text x="1516" y="532" class="b">• Typed errors &amp; recovery</text>

  <line x1="925" y1="572" x2="925" y2="596" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============================ PLUGIN SYSTEM ============================ -->
  <text x="60" y="618" class="cap" fill="#f59e0b">PLUGIN SYSTEM · sandboxed WebAssembly (wasmtime)</text>
  <rect x="60" y="626" width="1730" height="188" rx="12" fill="#0c1322" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="2"/>

  <rect x="80" y="644" width="270" height="152" rx="8" fill="#131c2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="96" y="670" class="h" fill="#f59e0b">Plugin Manager</text>
  <text x="96" y="692" class="b">• Discovery · PluginRegistry</text>
  <text x="96" y="710" class="b">• Marketplace install (sha256)</text>
  <text x="96" y="728" class="b">• Per-instance state &amp; teardown</text>

  <rect x="364" y="644" width="270" height="152" rx="8" fill="#131c2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="380" y="670" class="h" fill="#f59e0b">WASM Runtime</text>
  <text x="380" y="692" class="b">• wasmtime engine</text>
  <text x="380" y="710" class="b">• Fuel limits · linear memory</text>
  <text x="380" y="728" class="b">• Component model (WIT v0.3.0)</text>

  <rect x="648" y="644" width="270" height="152" rx="8" fill="#131c2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="664" y="670" class="h" fill="#f59e0b">Capabilities (Exports)</text>
  <text x="664" y="692" class="b">• file-loader · file-viewer</text>
  <text x="664" y="710" class="b">• data-source · data-producer</text>
  <text x="664" y="728" class="b">• data-renderer · exporter</text>
  <text x="664" y="746" class="b">• ui-component · plugin-cli</text>

  <rect x="932" y="644" width="270" height="152" rx="8" fill="#131c2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="948" y="670" class="h" fill="#f59e0b">Host Imports</text>
  <text x="948" y="692" class="b">• dataset-bus (publish / arrow)</text>
  <text x="948" y="710" class="b">• dataset-read (read / read-arrow)</text>
  <text x="948" y="728" class="b">• http-client · tcp · db-runtime</text>
  <text x="948" y="746" class="b">• storage · secure · ui-tabs</text>

  <rect x="1216" y="644" width="270" height="152" rx="8" fill="#131c2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1232" y="670" class="h" fill="#f59e0b">Policy &amp; Consent</text>
  <text x="1232" y="692" class="b">• Host allowlist · SSRF guard</text>
  <text x="1232" y="710" class="b">• Rate limits · fuel quotas</text>
  <text x="1232" y="728" class="b">• dataset_grants cross-read</text>
  <text x="1232" y="746" class="b">• User approval prompts</text>

  <rect x="1500" y="644" width="270" height="152" rx="8" fill="#131c2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1516" y="670" class="h" fill="#f59e0b">Bundled Plugins</text>
  <text x="1516" y="692" class="b">• url-source (HTTP / REST)</text>
  <text x="1516" y="710" class="b">• seshat (Postgres / MySQL)</text>
  <text x="1516" y="728" class="b">• csv-export (streaming export)</text>
  <text x="1516" y="746" class="b">• card-view · material-theme</text>

  <line x1="925" y1="814" x2="925" y2="838" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============================ DATA & FILE ENGINE ============================ -->
  <text x="60" y="860" class="cap" fill="#f472b6">DATA &amp; FILE ENGINE · DuckDB · Apache Arrow · TextIndex</text>
  <rect x="60" y="868" width="1730" height="124" rx="12" fill="#0c1322" stroke="#f472b6" stroke-opacity="0.35" stroke-width="2"/>

  <rect x="80" y="886" width="325" height="88" rx="8" fill="#131c2e" stroke="#f472b6" stroke-width="1.5"/>
  <text x="96" y="912" class="h" fill="#f472b6">DuckDB Engine</text>
  <text x="96" y="934" class="b">• JSON, NDJSON, CSV, Parquet</text>
  <text x="96" y="952" class="b">• Arrow, Avro, Excel, SQLite</text>

  <rect x="421" y="886" width="325" height="88" rx="8" fill="#131c2e" stroke="#f472b6" stroke-width="1.5"/>
  <text x="437" y="912" class="h" fill="#f472b6">Apache Arrow &amp; IPC</text>
  <text x="437" y="934" class="b">• RecordBatch · RecordWindow</text>
  <text x="437" y="952" class="b">• ArrowNode tree · typed IPC</text>

  <rect x="762" y="886" width="325" height="88" rx="8" fill="#131c2e" stroke="#f472b6" stroke-width="1.5"/>
  <text x="778" y="912" class="h" fill="#f472b6">Envelopes &amp; Relations</text>
  <text x="778" y="934" class="b">• json_envelope extraction</text>
  <text x="778" y="952" class="b">• Per-relation handles &amp; tables</text>

  <rect x="1103" y="886" width="325" height="88" rx="8" fill="#131c2e" stroke="#f472b6" stroke-width="1.5"/>
  <text x="1119" y="912" class="h" fill="#f472b6">TextIndex Fallback</text>
  <text x="1119" y="934" class="b">• Line-offset index (Source::Text)</text>
  <text x="1119" y="952" class="b">• Huge / unstructured files</text>

  <rect x="1444" y="886" width="325" height="88" rx="8" fill="#131c2e" stroke="#f472b6" stroke-width="1.5"/>
  <text x="1460" y="912" class="h" fill="#f472b6">File System &amp; Cache</text>
  <text x="1460" y="934" class="b">• Disk index cache (bounded LRU)</text>
  <text x="1460" y="952" class="b">• Cross-platform I/O · staging</text>

  <!-- ============================ FOOTER ============================ -->
  <rect x="60" y="1022" width="1730" height="162" rx="12" fill="#0f1419" stroke="#374151" stroke-dasharray="5,5" stroke-width="2"/>
  <text x="84" y="1052" class="note-h">KEY DESIGN PRINCIPLES</text>
  <text x="84" y="1082" class="note">• Single handle-based data plane (Papyrus) — producers publish once; DataView, Chart Studio, renderers and exporters page by handle with revisions &amp; pins.</text>
  <text x="84" y="1106" class="note">• Display-independent core — thoth-core has zero egui/eframe dependencies; thoth-cli runs headless/CLI; thoth-ui connects via small host seams.</text>
  <text x="84" y="1130" class="note">• Typed Arrow &amp; zero-copy streaming — DuckDB + Arrow RecordBatch windows keep huge files fast; publish-arrow / read-arrow preserve types, nulls &amp; nesting.</text>
  <text x="84" y="1154" class="note">• Capability sandbox — WASM components share thoth-plugin-sdk widgets and access network, storage, and dataset-read only via consent-gated WIT imports.</text>
</svg>
