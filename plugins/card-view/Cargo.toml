[package]
name = "card-view"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]   # required for WASM component output

[dependencies]
wit-bindgen-rt = "0.41"
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
thoth-plugin-sdk = { path = "../../thoth-plugin-sdk", features = ["plugin"] }

[package.metadata.component]
package = "thoth:card-view"

[package.metadata.component.target]
path  = "../../wit"
world = "data-renderer-plugin"
