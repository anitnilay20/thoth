[workspace]
resolver = "3"
members = [
  "thoth-core",
  "thoth-cli",
  "thoth-ui",
  "plugins/url-source",
  "plugins/seshat",
  "plugins/csv-export",
  "plugins/card-view",
  "thoth-plugin-sdk",
  "thoth-plugin-sdk-macros",
]
# Plugins are wasm32 crates built separately with `cargo component build`.
# default-members restricts `cargo build` / `cargo check` at the workspace
# root to the desktop app and its libraries, so plugins are not compiled for the
# host target by default.
default-members = ["thoth-ui"]
