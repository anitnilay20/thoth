name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-${{ matrix.rust }}
          cache-on-failure: true

      # keyring's Linux secret-service backend links libdbus (libdbus-sys), which
      # needs the dbus dev headers + pkg-config at build time.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      # Test the host, the SDK and the macros crate. `cargo test` runs unit,
      # integration (tests/*) and doc tests in one pass — the workspace
      # `default-members` is just the host crate, so the SDK + macros are named
      # explicitly (the wasm plugins are excluded: they only build for wasm32).
      # The SDK's UI tests live behind its `egui` feature, so it is built and
      # tested in a second command with that feature on. The host's `profiling`
      # feature (puffin + dhat) is deliberately not enabled: it slows the build
      # and buys nothing for the test pass.
      - name: Run tests
        run: |
          cargo test -p thoth -p thoth-plugin-sdk-macros
          cargo test -p thoth-plugin-sdk --features egui

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      # keyring's Linux secret-service backend links libdbus at build time.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # keyring's Linux secret-service backend links libdbus at build time.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # llvm-cov instead of tarpaulin: tarpaulin re-runs every test binary under
      # its own instrumentation, which is where most of its ~46 minutes went.
      # llvm-cov runs the binaries normally and post-processes the `.profraw`
      # files they emit, cutting the coverage job to roughly the build time.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov test --all-features --cobertura --output-path cobertura.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cobertura.xml
          fail_ci_if_error: false
