[package]
name = "thoth-core"
version = "0.4.7"
edition = "2024"
rust-version = "1.92"
repository = "https://github.com/anitnilay20/thoth"
authors = ["Anit Nilay <anit.nilay20@gmail.com>"]
description = "Core logic for Thoth: data loading, the Papyrus data bus, the sandboxed WebAssembly plugin runtime, MCP, settings and updates."
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "thoth_core"
path = "src/lib.rs"

[dependencies]
thoth-plugin-sdk = { path = "../thoth-plugin-sdk", features = ["egui"] }
clap = { version = "4.5", features = ["derive", "string"] }
clap_complete = "4.5"
eframe = "0.34"
egui-phosphor = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = "0.3"
toml = "0.8"
dirs = "5.0"
fontdb = "0.23"
rfd = "0.15.4"
anyhow = "1.0"
rayon = "1.11.0"
memchr = "2.7"
self_update = { version = "0.41", features = [
  "archive-tar",
  "archive-zip",
  "compression-flate2",
] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1.42", features = ["rt", "rt-multi-thread", "sync", "macros", "io-std"] }
chrono = "0.4"
flate2 = "1.0"
tar = "0.4"
zip = "0.6"
sha2 = "0.10"
open = "5.0"
which = "7.0"
wasmtime = { version = "43.0.0", features = ["component-model", "cache"] }
wasmtime-wasi = "43.0.0"
wasmtime-wasi-http = "43"
rustls = "0.23"
webpki-roots = "0.26"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
wit-bindgen = "0.54.0"
egui-notify = "0.22.0"
egui_code_editor = "0.2.24"
egui_dock = "0.19"
raw-window-handle = "0.6.2"
tempfile = "3.15"
rmcp = { version = "1.5", features = ["server", "transport-io", "macros"] }
schemars = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
duckdb = { version = "~1.10505.0", features = ["bundled", "json", "parquet", "vtab-arrow"] }
arrow = { version = "58.4", features = ["json"] }
unicode-width = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = "0.19.2"

[dev-dependencies]
proptest = "1.5"
